name: Deploy GitHub Pages preview

# Default: push to develop → https://abuhasnat-cb.github.io/portfolio/
# Pre-merge: Actions → this workflow → Run workflow → choose a feature branch.
# That temporarily replaces the develop preview until develop is redeployed.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /portfolio
  SITE_URL: https://abuhasnat-cb.github.io/portfolio

jobs:
  build:
    name: Build static export (/portfolio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with Pages base path
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
          SITE_URL: ${{ env.SITE_URL }}
      - name: Verify preview SEO guards and asset prefix
        run: |
          grep -q '/portfolio/_next' out/index.html
          grep -qi 'noindex' out/index.html
          grep -q 'Disallow: /' out/robots.txt
          grep -q 'abuhasnat-cb.github.io/portfolio' out/llms.txt
          grep -q 'abuhasnat-cb.github.io/portfolio' out/index.md
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Attempt to create/enable the Pages site when it does not exist yet.
          # If this still fails, the owner must set Settings → Pages → Source = GitHub Actions.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
