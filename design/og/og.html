<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0b0c;
      }
      .c {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #ececee;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        border: 2px solid #232328;
        background: #131315;
        display: grid;
        place-items: center;
        font:
          500 22px/1 "Geist Mono",
          monospace;
        letter-spacing: 0.02em;
      }
      h1 {
        margin: 0;
        font:
          500 92px/1.05 "Geist",
          sans-serif;
        letter-spacing: -0.035em;
      }
      h1 i {
        font-style: normal;
        color: #8fa2ff;
      }
      p {
        margin: 26px 0 0;
        font:
          400 36px/1.3 "Geist",
          sans-serif;
        letter-spacing: -0.015em;
        color: #7c7c84;
      }
      .f {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          400 28px/1 "Geist Mono",
          monospace;
        color: #7c7c84;
      }
      .f b {
        font-weight: 500;
        color: #ececee;
      }
      .bar {
        width: 28px;
        height: 3px;
        border-radius: 2px;
        background: #8fa2ff;
        display: inline-block;
        vertical-align: middle;
        margin-right: 16px;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div class="logo">AO</div>
      <div>
        <h1>Abu Hasnat Ovee<i>.</i></h1>
        <p>AI-native Software Engineer</p>
      </div>
      <div class="f">
        <span><span class="bar"></span><b>oveehasnat.com</b></span
        ><span>portfolio</span>
      </div>
    </div>
  </body>
</html>
